@if (visible()) {
  <div
    class="border-b border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-950"
    role="region"
    [attr.aria-label]="'PWA.INSTALL_REGION_LABEL' | translate"
    data-testid="pwa-install-banner"
  >
    <div
      class="mx-auto flex max-w-5xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
    >
      <div class="space-y-1">
        <p class="font-semibold">{{ 'PWA.INSTALL_TITLE' | translate }}</p>
        <p>{{ 'PWA.INSTALL_DESCRIPTION' | translate }}</p>
      </div>
      <div class="flex shrink-0 flex-wrap gap-2">
        <button
          type="button"
          class="inline-flex items-center justify-center rounded-md bg-emerald-600 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-emerald-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
          data-testid="pwa-install-cta"
          (click)="install()"
        >
          {{ 'PWA.INSTALL_CTA' | translate }}
        </button>
        <button
          type="button"
          class="inline-flex items-center justify-center rounded-md border border-emerald-300 bg-white px-3 py-2 text-sm font-medium text-emerald-900 transition-colors hover:bg-emerald-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
          data-testid="pwa-install-dismiss"
          (click)="dismiss()"
        >
          {{ 'PWA.INSTALL_DISMISS' | translate }}
        </button>
      </div>
    </div>
  </div>
}
