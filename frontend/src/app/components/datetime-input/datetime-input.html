<div class="relative">
  <div class="flex flex-wrap gap-2">
    <div class="relative min-w-0 flex-1">
      <input
        [id]="inputId()"
        type="text"
        [formControl]="dateDisplayControl"
        [class]="inputClass()"
        [attr.placeholder]="'DATE_INPUT.PLACEHOLDER_DATE' | translate"
        [attr.data-testid]="testId()"
        [attr.aria-invalid]="ariaInvalid() ?? (parseError() || control().invalid)"
        [attr.aria-describedby]="ariaDescribedBy()"
        [attr.autocomplete]="'off'"
        (blur)="onBlur()"
        (paste)="onPaste($event)"
        (keydown)="onKeydown($event)"
      />
      @if (calendarOpen()) {
        <div
          class="absolute z-20 mt-1 rounded-md border border-slate-200 bg-white p-3 shadow-md"
          (mousedown)="$event.preventDefault()"
        >
          <app-date-picker-calendar
            [selectedIso]="selectedDateIso()"
            [min]="min()"
            [max]="max()"
            (daySelected)="onDaySelected($event)"
          />
        </div>
      }
    </div>

    <input
      type="text"
      [formControl]="timeDisplayControl"
      class="w-24 shrink-0 rounded-md border border-slate-200 px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 disabled:bg-slate-100 disabled:cursor-not-allowed"
      [attr.placeholder]="'DATE_INPUT.PLACEHOLDER_TIME' | translate"
      [attr.autocomplete]="'off'"
      (blur)="onBlur()"
      (keydown)="onKeydown($event)"
    />

    <button
      type="button"
      class="shrink-0 rounded-md border border-slate-200 px-2.5 py-2 text-slate-700 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 disabled:cursor-not-allowed disabled:opacity-60"
      [attr.aria-label]="'DATE_INPUT.OPEN_CALENDAR' | translate"
      aria-haspopup="dialog"
      [attr.aria-expanded]="calendarOpen()"
      [disabled]="isDisabled()"
      (click)="toggleCalendar()"
    >
      📅
    </button>
  </div>

  @if (parseError()) {
    <span class="mt-1 block text-xs text-red-700">{{ 'DATE_INPUT.INVALID_DATE' | translate }}</span>
  }
</div>
