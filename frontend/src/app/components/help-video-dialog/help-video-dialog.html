<dialog
  #dialogEl
  data-testid="help-video-dialog"
  class="help-video-dialog m-auto w-[calc(100%-1rem)] max-w-4xl rounded-lg border border-slate-200 bg-white p-0 text-slate-900 shadow-lg backdrop:bg-slate-900/50 sm:w-[calc(100%-2rem)]"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  (click)="onBackdropClick($event)"
  (cancel)="onCancel($event)"
  (close)="onNativeClose()"
>
  <div class="flex max-h-[min(92dvh,52rem)] w-full flex-col overflow-hidden">
    <header
      class="flex shrink-0 items-start justify-between gap-3 border-b border-slate-200 px-3 py-3 sm:px-4"
    >
      <div class="min-w-0">
        <h2 [id]="titleId" class="truncate text-base font-semibold text-slate-900 sm:text-lg">
          @if (video(); as current) {
            {{ current.titleKey | translate }}
          }
        </h2>
        <p class="mt-1 text-xs text-slate-600 sm:text-sm">
          {{ 'HELP_VIDEOS.DIALOG.DESCRIPTION' | translate }}
        </p>
      </div>
      <button
        type="button"
        class="inline-flex size-8 shrink-0 items-center justify-center rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
        [attr.aria-label]="'COMMON.DIALOG.CLOSE_ARIA' | translate"
        (click)="requestClose()"
      >
        <span aria-hidden="true" class="text-xl leading-none">&times;</span>
      </button>
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto px-3 py-3 app-scrollbar-thin sm:px-4 sm:py-4">
      <div class="overflow-hidden rounded-lg border border-slate-200 bg-slate-950">
        <video
          #videoEl
          class="aspect-video max-h-[52dvh] w-full object-contain md:max-h-none"
          controls
          playsinline
          preload="metadata"
          [attr.aria-label]="video()?.titleKey ? (video()!.titleKey | translate) : null"
        ></video>
      </div>
      <p class="mt-3 text-xs leading-relaxed text-slate-500 sm:text-sm">
        {{ 'HELP_VIDEOS.DIALOG.MOBILE_HINT' | translate }}
      </p>
    </div>
  </div>
</dialog>
